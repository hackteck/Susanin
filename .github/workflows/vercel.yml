name: Vercel deploy

# Every push to master ships the site. `workflow_dispatch` stays, for a redeploy
# with no commit behind it. Pull requests get the checks but not the deploy.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck and tests run on their own so a pull request gets them without a
  # Vercel token, and so a red suite stops the deploy rather than following it.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The suite is `node --test` — no framework, no config. The unit tests
      # (geometry, transliteration) always run; the ones that need Batumi's feed
      # skip themselves with a reason when it is unreachable, which it is every
      # night once the fleet stops. See CLAUDE.md.
      - name: Test
        run: npm test

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scoped to this job rather than the workflow. `verify` installs and runs
    # the dependency tree of whatever a pull request proposes; the deploy token
    # has no business being in that job's environment.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check token
        run: '[ -n "$VERCEL_TOKEN" ] || { echo "VERCEL_TOKEN is not set"; exit 1; }'

      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      # The basemap is generated, not committed, and cut from a Protomaps planet
      # build that their bucket keeps for about a week — so a clean checkout
      # cannot always rebuild the pinned one. Cached on the script that pins it:
      # while the pin and the rectangle are unchanged every deploy gets the same
      # bytes without asking Protomaps anything, and a changed pin builds afresh.
      # The script's own fallback covers a cold cache and a dead pin together.
      - name: Restore the basemap
        uses: actions/cache@v6
        with:
          path: |
            .cache/basemap
            apps/web/public/tiles
          key: basemap-${{ runner.os }}-${{ hashFiles('tools/build-basemap.mjs') }}

      - name: Fetch project name from package.json
        id: project_name
        run: echo "PACKAGE_NAME=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT

      - name: Disable Vercel telemetry
        run: npx vercel telemetry disable

      - name: Link Vercel project
        env:
          PROJECT_NAME: ${{ steps.project_name.outputs.PACKAGE_NAME }}
        run: |
          npx vercel link --yes --project $PROJECT_NAME --token=$VERCEL_TOKEN
          npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      # Unlike surstromming, `vercel.json` is committed here and is NOT written
      # by this workflow. There it is one rewrite that only the deploy cares
      # about; here it declares the workspace build, the SPA output directory
      # and the serverless function that serves /api — project structure rather
      # than deploy trivia, and something `vercel dev` should see too.
      - name: Build
        run: npx vercel build --prod --token=$VERCEL_TOKEN


      # The basemap is generated, not committed, so it is the one deploy input
      # that can go missing without anything failing: a request for a tile that
      # is not there falls through the SPA rewrite to index.html, and the reader
      # gets "Wrong magic number for PMTiles archive" on a blank map. Ask the
      # bytes, not the exit code — `vercel build` succeeded either way.
      - name: Check the basemap landed in the build output
        shell: node {0}
        run: |
          const { openSync, readSync, closeSync, statSync, readFileSync } = require("fs");
          const root = ".vercel/output/static/tiles/";
          let manifest;
          try { manifest = JSON.parse(readFileSync(root + "manifest.json", "utf8")) } catch {
            console.error("::error::" + root + "manifest.json is missing — `npm run basemap` did not run, or Vite did not copy public/.");
            process.exit(1);
          }
          for (const [key, entry] of Object.entries(manifest.archives)) {
            const path = root + entry.url.split("/").pop();
            let size;
            try { size = statSync(path).size } catch {
              console.error("::error::" + path + " (" + key + ") is missing.");
              process.exit(1);
            }
            // The bytes, not the exit code: `vercel build` succeeded either way,
            // and a tile request that 404s falls through the SPA rewrite to
            // index.html, which the reader meets as "Wrong magic number".
            if (size !== entry.bytes) {
              console.error("::error::" + path + " is " + size + " bytes, manifest says " + entry.bytes + ".");
              process.exit(1);
            }
            const head = Buffer.alloc(7);
            const fd = openSync(path, "r");
            readSync(fd, head, 0, 7, 0);
            closeSync(fd);
            if (head.toString("latin1") !== "PMTiles") {
              console.error("::error::" + path + " is not a PMTiles archive.");
              process.exit(1);
            }
            console.log(key + ": " + size.toLocaleString() + " bytes");
          }
      - name: Deploy
        id: deploy
        run: |
          # stdout is the deployment URL and nothing else — the CLI documents
          # that contract — so this is read, not scraped off the log.
          URL=$(npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN | tr -d "\r" | tail -1)
          if [ -z "$URL" ]; then
            echo "::error::vercel deploy printed no deployment URL on stdout"
            exit 1
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployment: $URL" >> $GITHUB_STEP_SUMMARY

      # Deployment Protection covers the generated deployment URL, so the URL a
      # new deployment has is the one an unauthenticated request cannot reach;
      # the production domain is the one public address. It is read out of the
      # build rather than restated here — og:url is SITE_URL, filled in by
      # vite.site.ts — so the check and the site can never name two addresses.
      #
      # It asks the function for its health and accepts both answers the function
      # gives: 200, and 503 when Batumi's feed is down, which is upstream's
      # doing and not this deploy's. What fails is the function not answering at
      # all — Vercel's own NOT_FOUND, a timeout, the SPA's HTML — which is how
      # /api shipped broken twice with every step green. Before `remove --safe`,
      # so a broken release leaves the previous deployment there to roll back to.
      - name: Check the API answers on the production address
        shell: node {0}
        run: |
          const { readFileSync } = require("fs");
          const html = readFileSync(".vercel/output/static/index.html", "utf8");
          const site = /<meta property="og:url" content="([^"]+)"/.exec(html)?.[1];
          if (!site) {
            console.error("::error::no og:url in the built index.html — cannot tell which address was deployed");
            process.exit(1);
          }
          const url = new URL("api/health", site).href;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          (async () => {
            let last = "";
            // The production alias moves to the new deployment a few seconds after
            // `vercel deploy` returns, and a cold function fetches 1.27 MB first.
            for (let attempt = 1; attempt <= 6; attempt++) {
              try {
                const response = await fetch(url, { signal: AbortSignal.timeout(40000), headers: { accept: "application/json" } });
                const body = await response.text();
                let status;
                try { status = JSON.parse(body).status } catch {}
                if ((response.status === 200 || response.status === 503) && (status === "ok" || status === "degraded")) {
                  console.log(`${url} → ${response.status} ${status}`);
                  if (status === "degraded") console.log("::warning::the API is up but Batumi's feed is not answering right now");
                  return;
                }
                last = `${response.status} ${body.slice(0, 120).replace(/\s+/g, " ")}`;
              } catch (error) {
                last = error.message;
              }
              console.log(`attempt ${attempt}: ${last}`);
              await sleep(10000);
            }
            console.error(`::error::${url} is not the API answering: ${last}`);
            process.exit(1);
          })();

      - name: Remove other deployments
        env:
          PROJECT_NAME: ${{ steps.project_name.outputs.PACKAGE_NAME }}
        run: npx vercel remove --safe --yes $PROJECT_NAME --token=$VERCEL_TOKEN || echo "Nothing to remove"
