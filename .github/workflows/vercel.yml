name: Vercel deploy

# Every push to master ships the site. `workflow_dispatch` stays, for a redeploy
# with no commit behind it. Pull requests get the checks but not the deploy.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck and tests run on their own so a pull request gets them without a
  # Vercel token, and so a red suite stops the deploy rather than following it.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The suite is `node --test` — no framework, no config. The unit tests
      # (geometry, transliteration) always run; the ones that need Batumi's feed
      # skip themselves with a reason when it is unreachable, which it is every
      # night once the fleet stops. See CLAUDE.md.
      - name: Test
        run: npm test

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scoped to this job rather than the workflow. `verify` installs and runs
    # the dependency tree of whatever a pull request proposes; the deploy token
    # has no business being in that job's environment.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check token
        run: '[ -n "$VERCEL_TOKEN" ] || { echo "VERCEL_TOKEN is not set"; exit 1; }'

      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Fetch project name from package.json
        id: project_name
        run: echo "PACKAGE_NAME=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT

      - name: Disable Vercel telemetry
        run: npx vercel telemetry disable

      - name: Link Vercel project
        env:
          PROJECT_NAME: ${{ steps.project_name.outputs.PACKAGE_NAME }}
        run: |
          npx vercel link --yes --project $PROJECT_NAME --token=$VERCEL_TOKEN
          npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      # Unlike surstromming, `vercel.json` is committed here and is NOT written
      # by this workflow. There it is one rewrite that only the deploy cares
      # about; here it declares the workspace build, the SPA output directory
      # and the serverless function that serves /api — project structure rather
      # than deploy trivia, and something `vercel dev` should see too.
      - name: Build
        run: npx vercel build --prod --token=$VERCEL_TOKEN


      # The basemap is generated, not committed, so it is the one deploy input
      # that can go missing without anything failing: a request for a tile that
      # is not there falls through the SPA rewrite to index.html, and the reader
      # gets "Wrong magic number for PMTiles archive" on a blank map. Ask the
      # bytes, not the exit code — `vercel build` succeeded either way.
      - name: Check the basemap landed in the build output
        shell: node {0}
        run: |
          const { openSync, readSync, closeSync, statSync } = require("fs");
          const path = ".vercel/output/static/tiles/batumi.pmtiles";
          let size;
          try { size = statSync(path).size } catch {
            console.error("::error::" + path + " is missing — `npm run basemap` did not run, or Vite did not copy public/.");
            process.exit(1);
          }
          const head = Buffer.alloc(7);
          const fd = openSync(path, "r");
          readSync(fd, head, 0, 7, 0);
          closeSync(fd);
          if (head.toString("latin1") !== "PMTiles") {
            console.error("::error::" + path + " is not a PMTiles archive (starts with " + JSON.stringify(head.toString("latin1")) + ").");
            process.exit(1);
          }
          console.log("basemap present: " + size.toLocaleString() + " bytes");
      - name: Deploy
        id: deploy
        run: |
          # stdout is the deployment URL and nothing else — the CLI documents
          # that contract — so this is read, not scraped off the log.
          URL=$(npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN | tr -d "\r" | tail -1)
          if [ -z "$URL" ]; then
            echo "::error::vercel deploy printed no deployment URL on stdout"
            exit 1
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployment: $URL" >> $GITHUB_STEP_SUMMARY

      # No smoke test: Deployment Protection covers the generated deployment URL,
      # so the URL a new deployment has is the one an unauthenticated request
      # cannot reach. See CLAUDE.md.

      - name: Remove other deployments
        env:
          PROJECT_NAME: ${{ steps.project_name.outputs.PACKAGE_NAME }}
        run: npx vercel remove --safe --yes $PROJECT_NAME --token=$VERCEL_TOKEN || echo "Nothing to remove"
