name: Vercel deploy

# Every push to master ships the site. `workflow_dispatch` stays, for a redeploy
# with no commit behind it. Pull requests get the checks but not the deploy.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck and tests run on their own so a pull request gets them without a
  # Vercel token, and so a red suite stops the deploy rather than following it.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The suite is `node --test` — no framework, no config. The unit tests
      # (geometry, transliteration) always run; the ones that need Batumi's feed
      # skip themselves with a reason when it is unreachable, which it is every
      # night once the fleet stops. See CLAUDE.md.
      - name: Test
        run: npm test

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scoped to this job rather than the workflow. `verify` installs and runs
    # the dependency tree of whatever a pull request proposes; the deploy token
    # has no business being in that job's environment.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check token
        run: '[ -n "$VERCEL_TOKEN" ] || { echo "VERCEL_TOKEN is not set"; exit 1; }'

      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Fetch project name from package.json
        id: project_name
        run: echo "PACKAGE_NAME=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT

      - name: Disable Vercel telemetry
        run: npx vercel telemetry disable

      - name: Link Vercel project
        env:
          PROJECT_NAME: ${{ steps.project_name.outputs.PACKAGE_NAME }}
        run: |
          npx vercel link --yes --project $PROJECT_NAME --token=$VERCEL_TOKEN
          npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      # Unlike surstromming, `vercel.json` is committed here and is NOT written
      # by this workflow. There it is one rewrite that only the deploy cares
      # about; here it declares the workspace build, the SPA output directory
      # and the serverless function that serves /api — project structure rather
      # than deploy trivia, and something `vercel dev` should see too.
      - name: Build
        run: npx vercel build --prod --token=$VERCEL_TOKEN


      # The basemap is generated, not committed, so it is the one deploy input
      # that can go missing without anything failing: a request for a tile that
      # is not there falls through the SPA rewrite to index.html, and the reader
      # gets "Wrong magic number for PMTiles archive" on a blank map. Ask the
      # bytes, not the exit code — `vercel build` succeeded either way.
      - name: Check the basemap landed in the build output
        shell: node {0}
        run: |
          const { openSync, readSync, closeSync, statSync } = require("fs");
          const path = ".vercel/output/static/tiles/batumi.pmtiles";
          let size;
          try { size = statSync(path).size } catch {
            console.error("::error::" + path + " is missing — `npm run basemap` did not run, or Vite did not copy public/.");
            process.exit(1);
          }
          const head = Buffer.alloc(7);
          const fd = openSync(path, "r");
          readSync(fd, head, 0, 7, 0);
          closeSync(fd);
          if (head.toString("latin1") !== "PMTiles") {
            console.error("::error::" + path + " is not a PMTiles archive (starts with " + JSON.stringify(head.toString("latin1")) + ").");
            process.exit(1);
          }
          console.log("basemap present: " + size.toLocaleString() + " bytes");
      - name: Deploy
        id: deploy
        run: |
          # stdout is the deployment URL and nothing else — the CLI documents
          # that contract — so this is read, not scraped off the log.
          URL=$(npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN | tr -d "\r" | tail -1)
          if [ -z "$URL" ]; then
            echo "::error::vercel deploy printed no deployment URL on stdout"
            exit 1
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployment: $URL" >> $GITHUB_STEP_SUMMARY

      # A build that succeeds while the function is broken is the failure mode
      # this catches — the frontend is static and will deploy happily on its
      # own. `/api/health` reaches all the way to Batumi, so this is genuinely
      # end to end, and it tolerates a degraded upstream because that is the
      # feed's night-time state and not a bad deploy.
      #
      # `vercel curl` carries the deployment-protection bypass itself, which is
      # what lets this reach the deployment at all: a plain curl against a
      # deployment URL gets Vercel's login page, because Standard Protection
      # covers exactly that URL and leaves only the production domain public.
      # Asking the CLI is the whole point — the alternative was recovering the
      # production alias out of `vercel inspect --json` or off the deploy log,
      # and neither is a contract worth gating a release on.
      #
      # It targets the deployment just built rather than production, and that is
      # the deliberate trade: this answers "does the thing we just made work",
      # and no longer notices a deploy that was never promoted. A promotion
      # failure is visible in the dashboard; a broken function is not.
      #
      # `vercel curl` is beta, so this is built not to trust it: the body is the
      # signal, never the exit code and never a status line. If the command
      # breaks outright the body is empty and the step fails, which is the right
      # way round for a release gate.
      - name: Smoke the deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "checking $DEPLOYMENT_URL/api/health"
          npx vercel curl --deployment "$DEPLOYMENT_URL" /api/health --yes --token=$VERCEL_TOKEN >health.json 2>health.err || true
          cat health.err >&2 || true
          head -c 1000 health.json || true
          echo

          # Our own payload is the only thing that tells a healthy API apart
          # from a login interstitial, which is HTML and answers 200.
          if grep -q '"status":[[:space:]]*"ok"' health.json; then
            echo "API is up."
          elif grep -q '"status":[[:space:]]*"degraded"' health.json; then
            # Ours says `degraded` in the body. A crashed or timed-out function
            # does not, and that is a bad deploy rather than Batumi asleep.
            echo "::warning::API reachable but upstream is degraded — deployment kept."
          else
            echo "::error::$DEPLOYMENT_URL/api/health did not answer with our health payload. If the body above is HTML the protection bypass did not apply — check that this CLI version still has 'vercel curl' and that the project is linked. The deployment is left up."
            exit 1
          fi
      - name: Remove other deployments
        env:
          PROJECT_NAME: ${{ steps.project_name.outputs.PACKAGE_NAME }}
        run: npx vercel remove --safe --yes $PROJECT_NAME --token=$VERCEL_TOKEN || echo "Nothing to remove"
